# Companion app for the Artemis Watch firmware. Generate the Xcode project:
#   cp ios/Local.xcconfig.example ios/Local.xcconfig   # once, then fill it in
#   cd ios && xcodegen
name: Artemis
options:
  bundleIdPrefix: dev.artemis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Artemis:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Artemis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).artemis-watch
        INFOPLIST_FILE: Artemis/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEVELOPMENT_ASSET_PATHS: ""
    preBuildScripts:
      - name: Bundle watch firmware
        basedOnDependencyAnalysis: false
        script: |
          # Ships the current watch build inside the app for one-tap updates.
          src="$SRCROOT/../firmware/build/artemis-fw.bin"
          dst="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$dst"
          if [ -f "$src" ]; then
            cp "$src" "$dst/artemis-fw.bin"
          else
            echo "warning: $src not built; the app will only offer importing a firmware file"
            rm -f "$dst/artemis-fw.bin"
          fi
